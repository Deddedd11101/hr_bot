<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Код входа в HR-бот</title>
</head>
<body style="margin:0;padding:0;background-color:#080B10;color:#F3F6FA;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;background-color:#080B10;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:100%;max-width:600px;background-color:#111622;border:1px solid #2B3442;border-top:3px solid #BADA1E;">
          <tr>
            <td style="padding:22px 32px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="font-size:12px;font-weight:700;letter-spacing:2px;line-height:18px;color:#BADA1E;">ПОДТВЕРЖДЕНИЕ ВХОДА</td>
                  <td align="right" valign="top" width="32">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="24" height="24" style="width:24px;height:24px;border-top:8px solid #BADA1E;border-right:8px solid #BADA1E;font-size:0;line-height:0;">&nbsp;</td></tr></table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="right" style="padding:12px 48px 8px;">
              <img src="cid:staff-otp-mark" width="112" height="118" alt="" style="display:block;width:112px;height:118px;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:18px 32px 0;font-size:12px;font-weight:700;letter-spacing:2px;line-height:18px;color:#C0CAD6;">ОДНОРАЗОВЫЙ КОД</td>
          </tr>
          <tr>
            <td style="padding:12px 32px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;background-color:#17202B;border:1px solid #354252;">
                <tr>
                  <td align="center" style="padding:22px 12px;color:#BADA1E;font-size:38px;font-weight:700;letter-spacing:5px;line-height:46px;font-variant-numeric:tabular-nums;white-space:nowrap;">$code</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 32px 0;color:#AAB5C4;font-size:14px;line-height:21px;">Код действует 10 минут.</td>
          </tr>
          <tr>
            <td style="padding:26px 32px 30px;color:#E8EDF3;font-size:16px;line-height:25px;">Вернитесь в чат с HR-ботом и отправьте эти шесть цифр одним сообщением.</td>
          </tr>
          <tr>
            <td style="border-top:1px solid #2B3442;padding:20px 32px 2px;color:#9DAABD;font-size:12px;line-height:19px;">
              Если вы не запрашивали код, не сообщайте его никому и обратитесь в HR.<br>
              Запрос из Telegram ID $telegram_user_id.
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 20px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="24" height="24" style="width:24px;height:24px;border-bottom:8px solid #BADA1E;border-left:8px solid #BADA1E;font-size:0;line-height:0;">&nbsp;</td></tr></table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
