<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f8f8f7;--ink:#181817;--muted:#5f615e;--line:#dedfdb;--accent:#147343}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--ink:#f0f0ef;--muted:#b7b8b4;--line:#393a37;--accent:#73c99a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
main{max-width:590px;margin:auto;padding:24px 18px max(24px,env(safe-area-inset-bottom));overflow-wrap:anywhere}
h1{font-size:26px;margin:4px 0 0}h2{font-size:17px;margin:0 0 8px}p,dl,dd{margin:0}header p,dt,small,#status{color:var(--muted)}
section{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}dl>div,li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
ul{list-style:none;padding:0;margin:0}li{grid-template-columns:minmax(0,1fr) auto;align-items:center}small{display:block}
button{border:1px solid var(--line);border-radius:6px;color:var(--accent);background:transparent;padding:8px;font:inherit;cursor:pointer}button:disabled{opacity:.6}#status{margin-top:12px}
:root{--radius:.875rem;--accent:oklch(.548 .116 156.9);--card:#fff;--highlight:#e4f3ea}
@media(prefers-color-scheme:dark){:root{--accent:oklch(.675 .121 158.2);--card:#242422;--highlight:#243b2e}}
:root{--cabinet-bottom:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px),var(--tg-content-safe-area-inset-bottom,0px))}
main{padding-bottom:calc(108px + var(--cabinet-bottom))}a{color:var(--accent)}
.cabinet-fullscreen main{padding-top:calc(24px + max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px))}
.profile-header-line{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
#fullscreen-toggle{min-height:36px;padding:6px 10px;background:var(--card)}
@media(min-width:760px){main{max-width:900px;padding-inline:28px}}
button{border-radius:8px;transition:background-color .16s ease,transform .16s ease}
button:not(:disabled):active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#navigation{position:fixed;bottom:calc(18px + var(--cabinet-bottom));left:18px;right:18px;z-index:1}
.tabs{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:480px;margin:auto;padding:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;box-shadow:0 8px 24px #0003}
.marker{position:absolute;inset:4px auto 4px 4px;width:calc((100% - 8px) / 5);background:var(--highlight);border-radius:999px;transition:transform .26s cubic-bezier(.2,.75,.3,1);pointer-events:none}
.tabs button{position:relative;display:grid;grid-template-rows:22px auto;place-items:center;align-content:center;gap:3px;min-height:50px;min-width:0;padding:3px 0;border:0;color:var(--muted);font-size:10px;line-height:1.15;text-align:center}
.tabs button[aria-current]{color:var(--ink);font-weight:700}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.tabs button[aria-current] svg{color:var(--accent)}
@supports(backdrop-filter:blur(14px)) or (-webkit-backdrop-filter:blur(14px)){
  .tabs{background:color-mix(in srgb,var(--card) 55%,transparent);border-color:color-mix(in srgb,var(--ink) 15%,transparent);box-shadow:inset 0 1px 0 #fff3,0 8px 24px #0003;-webkit-backdrop-filter:blur(22px) saturate(155%);backdrop-filter:blur(22px) saturate(155%)}
  .marker{background:color-mix(in srgb,var(--highlight) 69%,transparent);box-shadow:inset 0 1px 0 #fff2}
}
@media(max-width:380px){
  .tabs button{grid-template-rows:1fr;gap:0;min-height:46px}
  .tabs .tab-label{display:none}
  .tabs svg{width:22px;height:22px}
}
.breadcrumbs{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:12px;color:var(--muted);font-size:13px}
.breadcrumbs button{border:0;padding:4px 0;color:inherit;text-decoration:underline;text-underline-offset:3px}
.breadcrumbs [aria-current]{color:var(--ink)}
.profile-entry{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;color:var(--ink);background:var(--card)}
.profile-entry svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}
details{padding:0 12px;margin:10px 0;border:1px solid var(--line);background:var(--card);border-radius:var(--radius)}summary{padding:11px 0;font-weight:600;cursor:pointer}details>div{padding-bottom:12px}
.radar{display:block;width:100%;max-width:320px;margin:8px auto}.radar polygon{stroke:var(--accent);stroke-width:1.5}.radar .grid{stroke:var(--line);fill:none}
@media(prefers-reduced-motion:reduce){.marker,button{transition:none}button:not(:disabled):active{transform:none}}
h1{font-size:22px;line-height:1.25}h2{font-size:16px}
.brand{display:flex;align-items:center;gap:8px;font-size:12px}.brand img{width:20px;height:20px;object-fit:contain}
.vacation-balances{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vacation-balances>div{display:block;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.vacation-balances dd{margin-top:6px;font-weight:600}
#development dl{margin-bottom:14px}
.vacation-form{display:grid;gap:10px;margin:16px 0}.vacation-dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vacation-dates button{text-align:left;color:var(--ink);background:var(--card)}
.vacation-form button,.directory-search{border-radius:12px;border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.vacation-picker{margin:0;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.calendar-head button{min-width:38px;padding:4px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:17px repeat(6,36px);gap:4px;text-align:center}
.calendar-grid[aria-busy=true]{opacity:.55}
.calendar-grid button,.vacation-period,.vacation-balances dd{font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-variant-numeric:tabular-nums}
.calendar-grid small{font-size:11px}
.calendar-grid button{padding:5px 0;min-height:36px;border:0;border-radius:8px;color:var(--ink)}
.calendar-grid button.is-off{color:var(--muted);background:var(--bg)}
.calendar-grid button.is-range{background:var(--highlight)}
.calendar-grid button[aria-pressed=true]{background:#bada1e;color:#181817;font-weight:700}
.calendar-key{margin-top:8px;min-height:1.5em}
.vacation-badge{display:inline-flex;align-items:center;gap:5px;min-height:23px;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted);font-size:11px;font-weight:650;white-space:nowrap}
.vacation-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.vacation-badge[data-status=pending],.vacation-badge[data-status=pending_hr]{background:#fff0c2;color:#754604}
.vacation-badge[data-status=approved]{background:var(--highlight);color:var(--accent)}
.vacation-badge[data-status=rejected]{background:#f9e4e5;color:#932a37}
@media(prefers-color-scheme:dark){
  .vacation-badge[data-status=pending],.vacation-badge[data-status=pending_hr]{background:#40321c;color:#ffd67b}
  .vacation-badge[data-status=rejected]{background:#45272d;color:#ffadb5}
}
#vacation-submit{background:var(--highlight);font-weight:600}
#files button,#colleague-retry{background:var(--card);min-height:40px}
#knowledge-items li{display:block}
#knowledge-items a{display:block;padding:8px 0;text-underline-offset:3px}
.directory-search{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:9px 11px;font:inherit}
.directory-group{margin-top:14px}.directory-group h3{margin:0;font-size:13px;color:var(--muted)}
.directory-person{display:flex;align-items:center;gap:9px;min-width:0}
.directory-avatar{width:32px;height:32px;flex:none;padding:6px;background:var(--highlight);border-radius:50%;object-fit:contain}
.directory-avatar.has-avatar{padding:0;object-fit:cover}
.directory-chat{min-width:44px;min-height:44px;display:grid;place-items:center}
.directory-chat svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
<main>
 <header>
  <div class="profile-header-line"><p class="brand"><img src="/static/favicon.png" alt="">Личный кабинет</p><button id="fullscreen-toggle" type="button" hidden>На весь экран</button></div>
  <h1 id="name"></h1><p id="position"></p>
 </header>
 <p id="status" role="status"></p>
 <div id="content" hidden>
  <section data-view="profile"><h2>Профиль</h2><dl id="profile"></dl></section>
  <section data-view="profile"><h2>Команда</h2><dl id="team"></dl></section>
  <section data-view="profile"><button id="documents-open" class="profile-entry" type="button" aria-controls="documents">Документы<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></section>
  <section data-view="files" id="documents" hidden>
    <nav class="breadcrumbs" aria-label="Хлебные крошки"><button type="button" data-back-profile>Профиль</button><span aria-hidden="true">/</span><span aria-current="page">Документы</span></nav>
    <h2 tabindex="-1">Документы</h2><ul id="files"></ul>
  </section>
  <section data-view="development" id="development" hidden></section>
  <section data-view="vacation" hidden><h2>Отпуск <span id="vacation-year"></span></h2><dl class="vacation-balances"><div><dt>Использовано в этом году</dt><dd id="vacation-used">Не указано</dd></div><div><dt>Осталось</dt><dd id="vacation-remaining">Не указано</dd></div></dl>
    <form id="vacation-form" class="vacation-form">
      <input name="starts_on" type="hidden"><input name="ends_on" type="hidden">
      <div class="vacation-dates"><button id="vacation-start" type="button" aria-expanded="false" aria-controls="vacation-picker">Начало</button><button id="vacation-end" type="button" aria-expanded="false" aria-controls="vacation-picker">Последний день</button></div>
      <div id="vacation-picker" class="vacation-picker" hidden>
        <div class="calendar-head"><button id="month-prev" type="button" aria-label="Предыдущий месяц">‹</button><strong id="calendar-month"></strong><button id="month-next" type="button" aria-label="Следующий месяц">›</button></div>
        <div id="calendar-grid" class="calendar-grid"></div>
        <small id="calendar-status" class="calendar-key" role="status"></small>
      </div>
      <p id="vacation-status" role="status"></p>
      <button id="vacation-submit" type="submit">Проверить даты</button>
    </form>
    <h2>Мои заявки</h2><ul id="vacation-requests"></ul>
  </section>
  <section data-view="colleagues" id="colleagues" hidden>
    <h2>Коллеги</h2>
    <input id="colleague-search" class="directory-search" type="search" aria-label="Поиск коллег" placeholder="Имя, должность или группа">
    <p id="colleague-status" role="status"></p>
    <button id="colleague-retry" type="button" hidden>Повторить</button>
    <div id="colleague-groups"></div>
  </section>
  <section data-view="knowledge" id="knowledge" hidden>
    <nav class="breadcrumbs" aria-label="Хлебные крошки"><button type="button" data-back-profile>Профиль</button><span aria-hidden="true">/</span><span aria-current="page">База знаний</span></nav>
    <h2>База знаний</h2>
    <p id="knowledge-status" role="status"></p>
    <div id="knowledge-items"></div>
  </section>
 </div>
</main>
<nav id="navigation" aria-label="Разделы кабинета" hidden><div class="tabs"><span id="marker" class="marker" aria-hidden="true"></span>
<button type="button" data-view="profile" aria-label="Профиль" title="Профиль" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/></svg><span class="tab-label">Профиль</span></button>
<button type="button" data-view="development" aria-label="Развитие" title="Развитие"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 6-6 4 4 8-8m-6 0h6v6"/></svg><span class="tab-label">Развитие</span></button>
<button type="button" data-view="vacation" aria-label="Отпуск" title="Отпуск"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18m6 5h6"/></svg><span class="tab-label">Отпуск</span></button>
<button type="button" data-view="colleagues" aria-label="Коллеги" title="Коллеги"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/><circle cx="9" cy="7" r="4"/></svg><span class="tab-label">Коллеги</span></button>
<button type="button" data-view="knowledge" aria-label="База знаний" title="База знаний"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14m0-14a7 7 0 0 0-5-2H3v14h4a7 7 0 0 1 5 2m0-14a7 7 0 0 1 5-2h4v14h-4a7 7 0 0 0-5 2"/></svg><span class="tab-label">Знания</span></button>
</div></nav>
<script src="/static/employee-cabinet.js?v=13" defer></script>
</html>
