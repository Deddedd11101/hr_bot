<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f8f8f7;--ink:#181817;--muted:#5f615e;--line:#dedfdb;--accent:#147343}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--ink:#f0f0ef;--muted:#b7b8b4;--line:#393a37;--accent:#73c99a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:590px;margin:auto;padding:24px 18px max(24px,env(safe-area-inset-bottom));overflow-wrap:anywhere}
h1{font-size:26px;margin:4px 0 0}h2{font-size:17px;margin:0 0 8px}p,dl,dd{margin:0}header p,dt,small,#status{color:var(--muted)}
section{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}dl>div,li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
ul{list-style:none;padding:0;margin:0}li{grid-template-columns:minmax(0,1fr) auto;align-items:center}small{display:block}
button{border:1px solid var(--line);border-radius:6px;color:var(--accent);background:transparent;padding:8px;font:inherit;cursor:pointer}button:disabled{opacity:.6}#status{margin-top:12px}
:root{--radius:.875rem;--accent:oklch(.548 .116 156.9);--card:#fff;--highlight:#e4f3ea}
@media(prefers-color-scheme:dark){:root{--accent:oklch(.675 .121 158.2);--card:#242422;--highlight:#243b2e}}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}button{border-radius:calc(var(--radius) - 4px)}a{color:var(--accent)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:1;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:570px;margin:auto}.marker{position:absolute;inset:0 auto 0 0;width:33.333%;background:var(--highlight);border-radius:var(--radius);transition:transform .22s ease;pointer-events:none}
.tabs button{position:relative;min-height:44px;border:0;color:var(--muted);font-size:13px}.tabs button[aria-selected=true]{color:var(--accent);font-weight:650}
details{padding:0 12px;margin:10px 0;border:1px solid var(--line);background:var(--card);border-radius:var(--radius)}summary{padding:11px 0;font-weight:600;cursor:pointer}details>div{padding-bottom:12px}
.radar{display:block;width:100%;max-width:320px;margin:8px auto}.radar polygon{stroke:var(--accent);stroke-width:1.5}.radar .grid{stroke:var(--line);fill:none}
@media(prefers-reduced-motion:reduce){.marker{transition:none}}
</style>
<main>
 <header><p>Личный кабинет</p><h1 id="name"></h1><p id="position"></p></header>
 <p id="status" role="status"></p>
 <div id="content" hidden>
  <section><h2>Профиль</h2><dl id="profile"></dl></section>
  <section><h2>Команда</h2><dl id="team"></dl></section>
  <section hidden><h2>Мои файлы</h2><ul id="files"></ul></section>
  <section id="development" hidden></section>
 </div>
</main>
<nav id="navigation" aria-label="Разделы кабинета" hidden><div class="tabs" role="tablist"><span id="marker" class="marker" aria-hidden="true"></span><button role="tab" aria-selected="true">Профиль</button><button role="tab" aria-selected="false">Документы</button><button role="tab" aria-selected="false">Развитие</button></div></nav>
<script src="/static/employee-cabinet.js" defer></script>
</html>
