<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оценка компетенций</title>
<style>
:root{color-scheme:light dark;--bg:#f8f8f7;--fg:#181817;--panel:#fff;--line:#dedfdb;--muted:#5f615e;--green:#147343;--accent:#bada1e}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--fg:#f0f0ef;--panel:#242422;--line:#444541;--muted:#bebfba;--green:#73c99a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
main{max-width:680px;margin:auto;padding:20px 16px 32px}h1,h2,p{margin:0 0 12px}h1{font-size:24px}h2{font-size:20px;overflow-wrap:anywhere}
progress{width:100%;accent-color:var(--green)}.muted{color:var(--muted);font-size:14px}
button,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px}
button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true]{border-color:var(--green);outline:1px solid var(--green)}
.option{width:100%;text-align:left;margin-bottom:8px;overflow-wrap:anywhere}.primary{background:var(--accent);color:#171717;border-color:var(--accent);font-weight:650}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,35%);gap:8px;width:100%;text-align:left;align-items:center;margin-bottom:6px;overflow-wrap:anywhere}
textarea{width:100%;resize:vertical;min-height:120px}#status:not(:empty){margin-top:12px}
</style>
<main>
  <h1>Оценка компетенций</h1>
  <p id="subject" class="muted"></p>
  <progress id="progress" hidden aria-label="Вопросы с ответами"></progress>
  <section id="view"></section>
  <p id="status" role="status">Загружаем опрос…</p>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/grade-review.js" defer></script>
</html>
