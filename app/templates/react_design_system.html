{% extends "react_base.html" %}

{% block extra_head %}
    <style>
        .main > .container:has(#react-design-system-root) {
            width: min(1760px, calc(100vw - var(--sidebar-width, 86px) - 32px));
            max-width: min(1760px, calc(100vw - var(--sidebar-width, 86px) - 32px));
            transition: width 0.28s ease, max-width 0.28s ease;
        }
    </style>
{% endblock %}

{% block content %}
<section class="react-page">
    <div id="react-design-system-root"></div>
</section>
{% endblock %}

{% block scripts %}
    <script type="module" src="/static/workspace_v2/design-system.js?v=5"></script>
{% endblock %}
