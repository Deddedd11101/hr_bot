{% extends "react_base.html" %}

{% block extra_head %}
    <style>
        .main > .container:has(#react-employees-root) {
            width: 100%;
            max-width: var(--admin-page-max-width);
            transition: width 0.28s ease, max-width 0.28s ease;
        }
    </style>
{% endblock %}

{% block content %}
<section class="react-page">
    <div
        id="react-employees-root"
        data-api-base-url="{{ react_create_url }}"
        data-create-url="{{ react_create_url }}"
        data-classic-url="{{ classic_page_url }}"
        data-default-list-kind="{{ react_default_list_kind }}"
    ></div>
</section>
{% endblock %}

{% block scripts %}
    <script type="module" src="/static/workspace_v2/employees-list.js?v=30"></script>
{% endblock %}
