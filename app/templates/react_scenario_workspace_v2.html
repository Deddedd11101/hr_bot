{% extends "react_base.html" %}

{% block extra_head %}
    <style>
        /*
         * Рабочая область занимает высоту экрана целиком. Ограничение снято
         * с .container и перенесено на саму область: раньше контейнер сужался
         * под «плавающую карточку», и полоса заголовка страницы оказывалась
         * зажата вместе с ним — разделитель не доходил до краёв поля.
         */
        .main:has(#react-scenario-workspace-v2-root) {
            padding-bottom: 0;
        }

        /*
         * Переполнение здесь не режем: полоса заголовка выходит за отступ
         * контейнера отрицательным полем, и overflow: hidden обрезал бы её
         * видимую часть на 20px с каждой стороны. По раскладке она при этом
         * оставалась бы на месте — getBoundingClientRect обрезку не видит.
         *
         * Канва ниже полосы обрезает себя сама.
         */
        .react-page:has(#react-scenario-workspace-v2-root),
        #react-scenario-workspace-v2-root {
            height: 100vh;
            min-height: 0;
        }

        /*
         * Единственная страница, где документ не прокручивается: высота
         * ровно в экран, а прокрутка живёт внутри панелей. Глобальный
         * overflow-y: scroll на html (index.css) резервирует здесь дорожку,
         * которой никогда не будет чем пользоваться, и она вставала рядом
         * с полосой внутреннего скроллера — 30px справа, из них 15 мёртвые.
         */
        html:has(#react-scenario-workspace-v2-root) {
            overflow-y: hidden;
        }
    </style>
{% endblock %}

{% block content %}
<section class="react-page">
    <div
        id="react-scenario-workspace-v2-root"
        data-api-url="{{ react_api_url }}"
        data-selected-scenario-id="{{ react_selected_scenario_id }}"
        data-workspace-kind="{{ workspace_kind }}"
        data-flash-message="{{ request.query_params.get('flash_message', '') }}"
        data-flash-type="{{ request.query_params.get('flash_type', 'success') }}"
    ></div>
</section>
{% endblock %}

{% block scripts %}
    <script type="module" src="/static/workspace_v2/scenario-workspace.js?v=98"></script>
{% endblock %}
