{% extends "react_base.html" %}

{% block extra_head %}
    <style>
        .main:has(#react-scenario-workspace-v2-root) {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-block: 24px;
        }

        .main > .container:has(#react-scenario-workspace-v2-root) {
            width: min(1760px, calc(100vw - var(--sidebar-width, 86px) - 32px));
            max-width: min(1760px, calc(100vw - var(--sidebar-width, 86px) - 32px));
            height: min(94vh, calc(100vh - 32px));
            max-height: min(94vh, calc(100vh - 32px));
            overflow: hidden;
            transition: width 0.28s ease, max-width 0.28s ease;
        }

        .react-page:has(#react-scenario-workspace-v2-root),
        #react-scenario-workspace-v2-root {
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        #react-scenario-workspace-v2-root {
            display: flex;
            flex-direction: column;
        }
    </style>
{% endblock %}

{% block content %}
<section class="react-page">
    <div
        id="react-scenario-workspace-v2-root"
        data-api-url="{{ react_api_url }}"
        data-selected-scenario-id="{{ react_selected_scenario_id }}"
        data-workspace-kind="{{ workspace_kind }}"
        data-flash-message="{{ request.query_params.get('flash_message', '') }}"
        data-flash-type="{{ request.query_params.get('flash_type', 'success') }}"
    ></div>
</section>
{% endblock %}

{% block scripts %}
    <script type="module" src="/static/workspace_v2/scenario-workspace.js?v=51"></script>
{% endblock %}
