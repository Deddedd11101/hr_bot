<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HR Bot Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/static/favicon.png?v=1">
    <script>
        (function () {
            try {
                var theme = window.localStorage.getItem("theme") === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", theme === "dark");
                document.documentElement.dataset.theme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = "light";
            }

            /*
             * Состояние сайдбара тоже восстанавливается до первой отрисовки.
             *
             * Раньше атрибут ставил React после монтирования: страница успевала
             * нарисоваться со свёрнутым рельсом, а потом ширина менялась, и
             * transition доигрывал переход на глазах. При переходе между
             * страницами с раскрытым меню это давало смещение раскладки 0.14
             * по метрике CLS при пороге 0.1.
             *
             * Ключ обязан совпадать с OPEN_KEY в shell-sidebar/page.tsx.
             */
            try {
                if (window.localStorage.getItem("app-shell-sidebar-open") === "1") {
                    document.documentElement.setAttribute("data-shell-sidebar-open", "");
                }
            } catch (error) {
                /* Хранилище недоступно — остаётся свёрнутое состояние по умолчанию. */
            }
        })();
    </script>
    <link rel="stylesheet" href="/static/react_shell.css?v=18">
    <link rel="stylesheet" href="/static/workspace_v2/app.css?v=93">
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-shell" id="app-shell">
    <div
        id="react-shell-sidebar-root"
        data-active-tab="{{ active_tab or '' }}"
        data-role-label="{{ role_labels.get(current_user.role, current_user.role) if current_user else 'Оператор' }}"
    ></div>

    <div class="app-shell-content">
        <main class="main">
            <div class="app-shell-container">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</div>

{% block scripts %}{% endblock %}
    <script type="module" src="/static/workspace_v2/shell-sidebar.js?v=30"></script>
</body>
</html>
