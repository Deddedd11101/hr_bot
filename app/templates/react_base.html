<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HR Bot Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/static/favicon.png?v=1">
    <script>
        (function () {
            try {
                var theme = window.localStorage.getItem("theme") === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", theme === "dark");
                document.documentElement.dataset.theme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>
    <link rel="stylesheet" href="/static/react_shell.css?v=6">
    <link rel="stylesheet" href="/static/workspace_v2/app.css?v=45">
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-shell" id="app-shell">
    <div
        id="react-shell-sidebar-root"
        data-active-tab="{{ active_tab or '' }}"
        data-role-label="{{ role_labels.get(current_user.role, current_user.role) if current_user else 'Оператор' }}"
    ></div>

    <div class="app-shell-content">
        <main class="main">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</div>

{% block scripts %}{% endblock %}
    <script type="module" src="/static/workspace_v2/shell-sidebar.js?v=5"></script>
</body>
</html>
