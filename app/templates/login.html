<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в HR Bot Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            try {
                var theme = window.localStorage.getItem("theme") === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", theme === "dark");
                document.documentElement.dataset.theme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>
    <link rel="stylesheet" href="/static/workspace_v2/app.css?v=39">
</head>
<body>
<div
    id="react-login-root"
    data-error-message="{{ error_message or '' }}"
></div>
<script type="module" src="/static/workspace_v2/login.js?v=1"></script>
</body>
</html>
