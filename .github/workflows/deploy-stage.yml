name: Deploy Stage

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy to stage: usually stage; branch, tag, or commit SHA"
        required: true
        default: "stage"
      grade_widget_pilot:
        description: "Grade widgets on stage: keep, off, or one reviewer card ID"
        required: false
        default: "keep"
      employee_cabinet_pilot:
        description: "Employee cabinet on stage (card 70 only)"
        type: choice
        options: ["keep", "on", "off"]
        default: "keep"

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ inputs.ref }}

    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app

      - name: Check undefined names
        run: ruff check --select F821 app tests

      - name: Run backend smoke tests
        env:
          TELEGRAM_BOT_TOKEN: ci-dummy-token
          DATABASE_URL: sqlite:///./ci.db
          ADMIN_SESSION_SECRET: ci-admin-session-secret
        run: python -m unittest discover -s tests -t . -v

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Smoke import application modules
        env:
          TELEGRAM_BOT_TOKEN: ci-dummy-token
          DATABASE_URL: sqlite:///./ci.db
          ADMIN_SESSION_SECRET: ci-admin-session-secret
        run: |
          python -c "from app.config import settings; assert settings.TIMEZONE"
          python -c "from app.main import app; assert app is not None"
          python -c "from app.bot_runner import main; assert main is not None"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ inputs.ref }}
      STAGE_DB_PATH: ${{ secrets.STAGE_DB_PATH }}
      GRADE_WIDGET_PILOT: ${{ inputs.grade_widget_pilot }}
      EMPLOYEE_CABINET_PILOT: ${{ inputs.employee_cabinet_pilot }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USERNAME }}
          password: ${{ secrets.STAGE_PASSWORD }}
          port: ${{ secrets.STAGE_PORT }}
          envs: DEPLOY_REF,STAGE_DB_PATH,GRADE_WIDGET_PILOT,EMPLOYEE_CABINET_PILOT
          script: |
            set -euo pipefail
            pilot="${GRADE_WIDGET_PILOT:-keep}"
            cabinet="${EMPLOYEE_CABINET_PILOT:-keep}"
            case "$cabinet" in keep|on|off) ;; *) exit 1 ;; esac
            if [[ "$pilot" != keep && "$pilot" != off && ! "$pilot" =~ ^[1-9][0-9]{0,17}$ ]]; then
              echo "Invalid grade widget pilot setting."
              exit 1
            fi
            cd "${{ secrets.STAGE_APP_DIR }}"
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Stage worktree is dirty; refusing deploy."
              git status --short --untracked-files=no
              exit 1
            fi
            db_path="${STAGE_DB_PATH:-hr_bot.db}"
            if [ ! -f "${db_path}" ]; then
              echo "Stage SQLite database not found: ${db_path}"
              exit 1
            fi
            mkdir -p backups
            deploy_ts="$(date +%Y%m%d-%H%M%S)"
            backup_path="backups/hr_bot.before-deploy.${deploy_ts}.db"
            scenario_snapshot="backups/scenarios.before-deploy.${deploy_ts}.json"
            .venv/bin/python - "${db_path}" "${backup_path}" "${scenario_snapshot}" <<'PY'
            import json
            import sqlite3
            import sys

            SCENARIO_CONFIG_TABLES = (
                "scenario_templates",
                "flow_step_templates",
                "step_button_notifications",
                "step_send_notifications",
            )

            source_path, backup_path, snapshot_path = sys.argv[1:4]
            with sqlite3.connect(source_path) as source, sqlite3.connect(backup_path) as backup:
                source.backup(backup)
                result = backup.execute("PRAGMA quick_check").fetchone()
                if not result or result[0] != "ok":
                    raise SystemExit(f"SQLite backup integrity check failed: {result}")

                snapshot = {}
                for table in SCENARIO_CONFIG_TABLES:
                    columns = [
                        row[1]
                        for row in source.execute(f'PRAGMA table_info("{table}")').fetchall()
                    ]
                    rows = source.execute(
                        f'SELECT * FROM "{table}" ORDER BY id'
                    ).fetchall()
                    snapshot[table] = {"columns": columns, "rows": rows}
                with open(snapshot_path, "w", encoding="utf-8") as handle:
                    json.dump(
                        snapshot,
                        handle,
                        ensure_ascii=False,
                        sort_keys=True,
                        default=str,
                    )

            print(f"SQLite backup created and verified: {backup_path}")
            print(f"Scenario configuration snapshot created: {snapshot_path}")
            PY
            git fetch --prune origin
            if git rev-parse --verify --quiet "origin/${DEPLOY_REF}^{commit}" >/dev/null; then
              target_ref="origin/${DEPLOY_REF}"
            else
              target_ref="${DEPLOY_REF}"
            fi
            git checkout -B stage-deploy "${target_ref}"
            .venv/bin/python -m pip install -r requirements.txt
            if [[ "$pilot" != keep || "$cabinet" != keep ]]; then
              restore_config_on_error() {
                local rc=$?
                if [[ "$rc" != 0 ]]; then
                  for target in "${!config_backups[@]}"; do
                    backup="${config_backups[$target]}"
                    if [[ -f "$backup" ]]; then cp -p -- "$backup" "$target"; else rm -f -- "$target"; fi
                  done
                  systemctl daemon-reload && systemctl restart hr-bot-web hr-bot-worker || true
                fi
              }
              declare -A config_backups=()
              trap restore_config_on_error EXIT
            fi
            if [[ "$pilot" != keep ]]; then
              pilot_dir=/etc/systemd/system/hr-bot-worker.service.d
              pilot_conf="$pilot_dir/90-grade-widget-pilot.conf"
              pilot_backup="${backup_path}.widget-pilot.conf"
              install -d -m 0755 "$pilot_dir"
              if [[ -f "$pilot_conf" ]]; then cp -p -- "$pilot_conf" "$pilot_backup"; fi
              config_backups["$pilot_conf"]="$pilot_backup"
              pilot_value="$pilot"
              if [[ "$pilot" == off ]]; then pilot_value=""; fi
              pilot_temp="$(mktemp "$pilot_dir/.grade-widget-pilot.XXXXXX")"
              printf '[Service]\nEnvironment="GRADE_WIDGET_REVIEWER_IDS=%s"\n' "$pilot_value" > "$pilot_temp"
              chmod 0644 "$pilot_temp"
              mv -f -- "$pilot_temp" "$pilot_conf"
              systemctl daemon-reload
              echo "Grade widget pilot setting applied."
            fi
            if [[ "$cabinet" != keep ]]; then
              cabinet_url=""
              if [[ "$cabinet" == on ]]; then cabinet_url="https://hr.zephyrlab.ru/employee-cabinet"; fi
              for service in hr-bot-web hr-bot-worker; do
                cabinet_dir="/etc/systemd/system/$service.service.d"
                cabinet_conf="$cabinet_dir/90-employee-cabinet-pilot.conf"
                cabinet_backup="${backup_path}.${service}.cabinet.conf"
                install -d -m 0755 "$cabinet_dir"
                if [[ -f "$cabinet_conf" ]]; then cp -p -- "$cabinet_conf" "$cabinet_backup"; fi
                config_backups["$cabinet_conf"]="$cabinet_backup"
                cabinet_temp="$(mktemp "$cabinet_dir/.cabinet.XXXXXX")"
                printf '[Service]\nEnvironment="EMPLOYEE_CABINET_URL=%s"\n' "$cabinet_url" > "$cabinet_temp"
                chmod 0644 "$cabinet_temp"
                mv -f -- "$cabinet_temp" "$cabinet_conf"
              done
              systemctl daemon-reload
            fi
            restart_since="$(date --iso-8601=seconds)"
            systemctl restart hr-bot-web
            systemctl restart hr-bot-worker
            systemctl is-active --quiet hr-bot-web
            systemctl is-active --quiet hr-bot-worker
            systemctl is-active --quiet wg-quick@redshield
            if [[ "$cabinet" != keep ]]; then
              for service in hr-bot-web hr-bot-worker; do
                pid="$(systemctl show "$service" --property=MainPID --value)"
                grep -zFxq -- "EMPLOYEE_CABINET_URL=$cabinet_url" "/proc/$pid/environ"
              done
              echo "Employee cabinet pilot verified in web and worker environments."
            fi
            if [[ "$pilot" != keep ]]; then
              worker_pid="$(systemctl show hr-bot-worker --property=MainPID --value)"
              if ! grep -zFxq -- "GRADE_WIDGET_REVIEWER_IDS=$pilot_value" "/proc/$worker_pid/environ"; then
                echo "Grade widget pilot is not present in the worker environment."
                exit 1
              fi
              echo "Grade widget pilot verified in the worker environment."
            fi
            .venv/bin/python - "${db_path}" "${scenario_snapshot}" <<'PY'
            import json
            import sqlite3
            import sys

            RESTORE_ORDER = (
                "step_button_notifications",
                "step_send_notifications",
                "flow_step_templates",
                "scenario_templates",
            )

            database_path, snapshot_path = sys.argv[1:3]
            with open(snapshot_path, encoding="utf-8") as handle:
                expected = json.load(handle)

            def read_current(connection):
                current = {}
                for table, table_snapshot in expected.items():
                    columns = table_snapshot["columns"]
                    column_list = ", ".join(f'"{column}"' for column in columns)
                    rows = connection.execute(
                        f'SELECT {column_list} FROM "{table}" ORDER BY id'
                    ).fetchall()
                    current[table] = {
                        "columns": columns,
                        "rows": [list(row) for row in rows],
                    }
                return current

            def restore_expected(connection):
                connection.execute("PRAGMA foreign_keys = OFF")
                for table in RESTORE_ORDER:
                    if table in expected:
                        connection.execute(f'DELETE FROM "{table}"')
                for table in reversed(RESTORE_ORDER):
                    table_snapshot = expected.get(table)
                    if not table_snapshot:
                        continue
                    columns = table_snapshot["columns"]
                    column_list = ", ".join(f'"{column}"' for column in columns)
                    placeholders = ", ".join("?" for _ in columns)
                    connection.executemany(
                        f'INSERT INTO "{table}" ({column_list}) VALUES ({placeholders})',
                        table_snapshot["rows"],
                    )

            with sqlite3.connect(database_path) as connection:
                current = read_current(connection)
                if current != expected:
                    print(
                        "Scenario configuration changed during deploy; "
                        "restoring pre-deploy scenario configuration from snapshot."
                    )
                    restore_expected(connection)
                    restored = read_current(connection)
                    if restored != expected:
                        raise SystemExit(
                            "Scenario configuration restore failed; inspect the verified "
                            "pre-deploy SQLite backup and scenario JSON snapshot before continuing."
                        )
                    connection.commit()
                    raise SystemExit(
                        "Scenario configuration changed during deploy and was restored from "
                        "the pre-deploy snapshot. Deploy is failed intentionally so the cause "
                        "can be investigated without losing analyst edits."
                    )
            print("Scenario configuration fingerprint unchanged.")
            PY
            wait_http_status() {
              path="$1"
              expected="$2"
              for attempt in $(seq 1 30); do
                code="$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 --max-time 5 "http://127.0.0.1:8000${path}" || true)"
                case " ${expected} " in
                  *" ${code} "*) echo "${path} status: ${code}"; return 0 ;;
                esac
                echo "Waiting for ${path}; attempt ${attempt}/30, status: ${code}"
                sleep 2
              done
              echo "Unexpected ${path} status after waiting: ${code}"
              return 1
            }
            wait_http_status "/app/employees" "200 303"
            wait_http_status "/app/flows/workspace-v2" "200 303"
            if [[ "$cabinet" == on ]]; then
              wait_http_status "/employee-cabinet" "200"
              wait_http_status "/employee-cabinet/profile" "403"
              wait_http_status "/employee-cabinet/files/1" "403"
            fi
            curl -4 -I --connect-timeout 10 https://api.telegram.org/
            journalctl -u hr-bot-worker --since "${restart_since}" --no-pager -n 100 | \
              grep -E "TelegramNetworkError|Request timeout|Traceback|Unclosed client session" && exit 1 || true
            git rev-parse --short HEAD
