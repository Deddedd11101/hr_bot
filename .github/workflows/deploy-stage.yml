name: Deploy Stage
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Read-only HR menu diagnostics; no checkout or deploy
        required: true
        default: stage
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only stage bot identity and service checks
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USERNAME }}
          password: ${{ secrets.STAGE_PASSWORD }}
          port: ${{ secrets.STAGE_PORT }}
          script: |
            set -eu
            cd "${{ secrets.STAGE_APP_DIR }}"
            git rev-parse HEAD
            git status --short --untracked-files=no
            systemctl is-active hr-bot-web hr-bot-worker wg-quick@redshield caddy
            .venv/bin/python - <<'PY'
            import asyncio
            import os
            from pathlib import Path
            import subprocess

            def service_env(service):
                pid = subprocess.check_output(['systemctl', 'show', service, '--property=MainPID', '--value'], text=True).strip()
                raw = Path('/proc', pid, 'environ').read_bytes()
                return dict(item.decode().split('=', 1) for item in raw.split(b'\0') if b'=' in item)

            web_env = service_env('hr-bot-web')
            worker_env = service_env('hr-bot-worker')
            os.environ.update(web_env)
            from app.config import settings
            from app.messaging.telegram import create_telegram_messenger

            async def inspect():
                client = create_telegram_messenger(settings.TELEGRAM_BOT_TOKEN)
                try:
                    me = await client.bot.get_me()
                    configured = web_env.get('TELEGRAM_BOT_USERNAME', '').strip().lstrip('@')
                    print('Telegram getMe username:', me.username)
                    print('Web configured username:', configured or 'MISSING')
                    print('Worker configured username:', worker_env.get('TELEGRAM_BOT_USERNAME', '') or 'MISSING')
                    print('Username matches:', bool(configured) and configured.lower() == me.username.lower())
                    print('Web/worker token env equal:', bool(web_env.get('TELEGRAM_BOT_TOKEN')) and web_env.get('TELEGRAM_BOT_TOKEN') == worker_env.get('TELEGRAM_BOT_TOKEN'))
                except Exception as exc:
                    print('Bot identity check failed:', type(exc).__name__)
                    raise SystemExit(1)
                finally:
                    await client.close()
            asyncio.run(inspect())
            PY
            curl -sS -o /dev/null -w 'HTTPS employees: %{http_code}\n' --connect-timeout 10 https://hr.zephyrlab.ru/app/employees
            curl -sS -o /dev/null -w 'HTTPS workspace: %{http_code}\n' --connect-timeout 10 https://hr.zephyrlab.ru/app/flows/workspace-v2
            if journalctl -u hr-bot-worker --since '5 minutes ago' --no-pager -n 100 | grep -E 'TelegramNetworkError|Request timeout|Traceback|Unclosed client session'; then exit 1; fi
