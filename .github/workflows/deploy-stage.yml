name: Deploy Stage

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy to stage: usually stage; branch, tag, or commit SHA"
        required: true
        default: "stage"

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ inputs.ref }}

    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app

      - name: Check undefined names
        run: ruff check --select F821 app tests

      - name: Run backend smoke tests
        env:
          TELEGRAM_BOT_TOKEN: ci-dummy-token
          DATABASE_URL: sqlite:///./ci.db
          ADMIN_SESSION_SECRET: ci-admin-session-secret
        run: python -m unittest tests.test_scenario_engine_smoke tests.test_messaging_identity tests.test_employee_api_smoke -v

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Smoke import application modules
        env:
          TELEGRAM_BOT_TOKEN: ci-dummy-token
          DATABASE_URL: sqlite:///./ci.db
          ADMIN_SESSION_SECRET: ci-admin-session-secret
        run: |
          python -c "from app.config import settings; assert settings.TIMEZONE"
          python -c "from app.main import app; assert app is not None"
          python -c "from app.bot_runner import main; assert main is not None"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ inputs.ref }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USERNAME }}
          password: ${{ secrets.STAGE_PASSWORD }}
          port: ${{ secrets.STAGE_PORT }}
          envs: DEPLOY_REF
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGE_APP_DIR }}"
            if [ -n "$(git status --porcelain)" ]; then
              echo "Stage worktree is dirty; refusing deploy."
              git status --short
              exit 1
            fi
            git fetch --prune origin
            if git rev-parse --verify --quiet "origin/${DEPLOY_REF}^{commit}" >/dev/null; then
              target_ref="origin/${DEPLOY_REF}"
            else
              target_ref="${DEPLOY_REF}"
            fi
            git checkout -B stage-deploy "${target_ref}"
            .venv/bin/python -m pip install -r requirements.txt
            systemctl restart hr-bot-web
            systemctl restart hr-bot-worker
            systemctl is-active --quiet hr-bot-web
            systemctl is-active --quiet hr-bot-worker
            systemctl is-active --quiet wg-quick@redshield
            employees_code="$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 http://127.0.0.1:8000/app/employees)"
            workspace_code="$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 http://127.0.0.1:8000/app/flows/workspace-v2)"
            case "${employees_code}" in 200|303) ;; *) echo "Unexpected /app/employees status: ${employees_code}"; exit 1 ;; esac
            case "${workspace_code}" in 200|303) ;; *) echo "Unexpected /app/flows/workspace-v2 status: ${workspace_code}"; exit 1 ;; esac
            curl -4 -I --connect-timeout 10 https://api.telegram.org/
            journalctl -u hr-bot-worker --since "5 minutes ago" --no-pager -n 100 | \
              grep -E "TelegramNetworkError|Request timeout|Traceback|Unclosed client session" && exit 1 || true
            git rev-parse --short HEAD
