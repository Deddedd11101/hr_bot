name: Stage Config Admin Session Secret

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ROTATE_STAGE_ADMIN_SESSION_SECRET to invalidate current admin sessions"
        required: true
        type: string

concurrency:
  group: deploy-stage
  cancel-in-progress: false

permissions: {}

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and verify stage admin session secret
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USERNAME }}
          password: ${{ secrets.STAGE_PASSWORD }}
          port: ${{ secrets.STAGE_PORT }}
          envs: CONFIRMATION
          command_timeout: 10m
          script: |
            set -eu
            test "$CONFIRMATION" = ROTATE_STAGE_ADMIN_SESSION_SECRET
            cd /opt/hr_bot
            git diff --quiet
            git diff --cached --quiet

            secret_file=/etc/hr-bot/admin-session.env
            web_dropin=/etc/systemd/system/hr-bot-web.service.d/70-admin-session.conf
            worker_dropin=/etc/systemd/system/hr-bot-worker.service.d/70-admin-session.conf
            preflight="$(.venv/bin/python - <<'PY'
            import os
            import stat
            import subprocess
            import sys
            from pathlib import Path

            secret_file = Path("/etc/hr-bot/admin-session.env")
            dropins = [
                Path("/etc/systemd/system/hr-bot-web.service.d/70-admin-session.conf"),
                Path("/etc/systemd/system/hr-bot-worker.service.d/70-admin-session.conf"),
            ]

            def service_env(service):
                pid = subprocess.check_output(
                    ["systemctl", "show", service, "--property=MainPID", "--value"], text=True,
                ).strip()
                raw = Path("/proc", pid, "environ").read_bytes()
                return dict(item.decode().split("=", 1) for item in raw.split(b"\0") if b"=" in item)

            def effective_secret(env):
                return subprocess.check_output(
                    [sys.executable, "-c", "from app.config import settings; print(settings.ADMIN_SESSION_SECRET)"],
                    env=env, cwd="/opt/hr_bot", text=True,
                ).strip()

            current = [effective_secret(service_env(service)) for service in ("hr-bot-web", "hr-bot-worker")]
            configured = secret_file.exists() or any(path.exists() for path in dropins)
            if configured:
                valid_files = secret_file.is_file() and all(path.is_file() for path in dropins)
                if valid_files:
                    line = secret_file.read_text().strip()
                    saved = line.partition("=")[2] if line.startswith("ADMIN_SESSION_SECRET=") else ""
                    valid_files = (
                        stat.S_IMODE(secret_file.stat().st_mode) == 0o600
                        and len(saved) == 64
                        and all(char in "0123456789abcdef" for char in saved)
                        and current == [saved, saved]
                    )
                if not valid_files:
                    raise SystemExit("Existing admin session config is partial or inconsistent; no rotation performed")
                print("already")
            elif current == ["change-me-admin-session-secret"] * 2:
                print("fresh")
            else:
                raise SystemExit("An existing non-default admin session key needs manual review; no rotation performed")
            PY
            )"
            if [ "$preflight" = already ]; then
              echo "Admin session secret is already configured consistently; no rotation performed"
              exit 0
            fi
            test "$preflight" = fresh
            backup_dir="/opt/hr_bot/backups/admin-session-config.$(date +%Y%m%d-%H%M%S).$$"
            mkdir -m 700 "$backup_dir"
            had_secret=no
            had_web=no
            had_worker=no
            if [ -e "$secret_file" ]; then cp -a "$secret_file" "$backup_dir/admin-session.env"; had_secret=yes; fi
            if [ -e "$web_dropin" ]; then cp -a "$web_dropin" "$backup_dir/web.conf"; had_web=yes; fi
            if [ -e "$worker_dropin" ]; then cp -a "$worker_dropin" "$backup_dir/worker.conf"; had_worker=yes; fi

            rollback() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                echo "Admin session config verification failed; restoring previous files"
                systemctl stop hr-bot-worker hr-bot-web || true
                if [ "$had_secret" = yes ]; then cp -a "$backup_dir/admin-session.env" "$secret_file"; else rm -f "$secret_file"; fi
                if [ "$had_web" = yes ]; then cp -a "$backup_dir/web.conf" "$web_dropin"; else rm -f "$web_dropin"; fi
                if [ "$had_worker" = yes ]; then cp -a "$backup_dir/worker.conf" "$worker_dropin"; else rm -f "$worker_dropin"; fi
                systemctl daemon-reload || true
                systemctl start hr-bot-web hr-bot-worker || true
              fi
              exit "$status"
            }
            trap rollback EXIT

            umask 077
            mkdir -p /etc/hr-bot "$(dirname "$web_dropin")" "$(dirname "$worker_dropin")"
            secret="$(openssl rand -hex 32)"
            temp="$secret_file.tmp.$$"
            printf 'ADMIN_SESSION_SECRET=%s\n' "$secret" > "$temp"
            chmod 600 "$temp"
            mv -f "$temp" "$secret_file"
            test "$(stat -c %a "$secret_file")" = 600
            unset secret
            for dropin in "$web_dropin" "$worker_dropin"; do
              temp="$dropin.tmp.$$"
              printf '[Service]\nEnvironmentFile=%s\n' "$secret_file" > "$temp"
              chmod 644 "$temp"
              mv -f "$temp" "$dropin"
            done
            systemctl daemon-reload
            systemctl stop hr-bot-worker hr-bot-web
            systemctl start hr-bot-web hr-bot-worker
            systemctl is-active --quiet hr-bot-web hr-bot-worker wg-quick@redshield

            .venv/bin/python - <<'PY'
            import subprocess
            from pathlib import Path

            def service_env(service):
                pid = subprocess.check_output(
                    ["systemctl", "show", service, "--property=MainPID", "--value"], text=True,
                ).strip()
                raw = Path("/proc", pid, "environ").read_bytes()
                return dict(item.decode().split("=", 1) for item in raw.split(b"\0") if b"=" in item)

            web = service_env("hr-bot-web")
            worker = service_env("hr-bot-worker")
            secret = web.get("ADMIN_SESSION_SECRET", "")
            equal = bool(secret) and secret == worker.get("ADMIN_SESSION_SECRET")
            nondefault = secret != "change-me-admin-session-secret"
            strong = len(secret) == 64 and all(char in "0123456789abcdef" for char in secret)
            dotenv_override_off = all(
                env.get("DOTENV_OVERRIDE", "false").lower() not in {"1", "true", "yes"}
                for env in (web, worker)
            )
            print("web_worker_secret_equal:", equal)
            print("admin_session_secret_nondefault:", nondefault)
            print("admin_session_secret_strong:", strong)
            print("dotenv_override_off:", dotenv_override_off)
            if not (equal and nondefault and strong and dotenv_override_off):
                raise SystemExit(1)
            PY

            wait_http() {
              kind="$1"
              url="$2"
              attempt=0
              status=000
              while [ "$attempt" -lt 15 ]; do
                if [ "$kind" = telegram ]; then
                  status="$(curl -4 -sSI -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 "$url" || true)"
                else
                  status="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 "$url" || true)"
                fi
                case "$status" in 2??|3??) return 0 ;; esac
                attempt=$((attempt + 1))
                sleep 2
              done
              echo "HTTP smoke failed: $url (last status $status)"
              return 1
            }
            wait_http app http://127.0.0.1:8000/app/employees
            wait_http app http://127.0.0.1:8000/app/flows/workspace-v2
            wait_http public https://hr.zephyrlab.ru/login
            wait_http telegram https://api.telegram.org/
            echo "Stage admin session secret rotated and verified; current admin sessions need a new login"
