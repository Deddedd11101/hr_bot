name: Stage Diagnostics

# Read-only проверка стенда: ничего не делает checkout, restart, deploy или
# записи в БД. Раньше эта диагностика жила на ветке ops/hr-menu-preflight под
# именем "Deploy Stage" — запуск с неверным --ref превращался в реальную выкладку.

on:
  workflow_dispatch:
    inputs:
      worker_log_minutes:
        description: "За сколько минут смотреть worker logs на Telegram/network ошибки"
        required: false
        default: "5"
      traceback_frames:
        description: "Показать только Python frames и класс исключения, без текста логов"
        required: false
        default: "false"
      employee_runtime_id:
        description: "Optional employee ID: read-only active scenario IDs/step keys, no answers or identity data"
        required: false
        default: ""

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      WORKER_LOG_MINUTES: ${{ inputs.worker_log_minutes }}
      TRACEBACK_FRAMES: ${{ inputs.traceback_frames }}
      EMPLOYEE_RUNTIME_ID: ${{ inputs.employee_runtime_id }}
      STAGE_DB_PATH: ${{ secrets.STAGE_DB_PATH }}

    steps:
      - name: Read-only stage checks over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USERNAME }}
          password: ${{ secrets.STAGE_PASSWORD }}
          port: ${{ secrets.STAGE_PORT }}
          envs: WORKER_LOG_MINUTES,TRACEBACK_FRAMES,EMPLOYEE_RUNTIME_ID,STAGE_DB_PATH
          script: |
            set -eu
            cd "${{ secrets.STAGE_APP_DIR }}"
            failures=0

            if [ -n "${EMPLOYEE_RUNTIME_ID}" ]; then
              echo "== Read-only employee runtime IDs =="
              .venv/bin/python - <<'PY'
            from contextlib import closing
            import json
            import os
            from pathlib import Path
            import sqlite3

            raw = os.environ["EMPLOYEE_RUNTIME_ID"]
            if not raw.isascii() or not raw.isdigit() or int(raw) <= 0:
                raise SystemExit("employee_runtime_id must be a positive numeric ID")
            path = Path(os.environ.get("STAGE_DB_PATH") or "hr_bot.db").resolve()
            with closing(sqlite3.connect(path.as_uri() + "?mode=ro", uri=True)) as db:
                db.row_factory = sqlite3.Row
                rows = db.execute("""SELECT id, employee_id, recipient_employee_id, scenario_key,
                    current_step_key, waiting_for_response, is_completed, adaptation_plan_item_id, updated_at
                    FROM scenario_progress WHERE (employee_id=? OR recipient_employee_id=?)
                    AND (waiting_for_response=1 OR is_completed=0) ORDER BY id""", (int(raw), int(raw))).fetchall()
                print(json.dumps([dict(row) for row in rows], ensure_ascii=True))
            PY
            fi

            echo "== Git =="
            echo "deployed: $(git rev-parse HEAD) ($(git log -1 --format=%s))"
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "tracked dirt on server worktree:"
              git status --short --untracked-files=no
              failures=$((failures + 1))
            else
              echo "tracked worktree clean"
            fi

            echo "== Services =="
            for unit in hr-bot-web hr-bot-worker wg-quick@redshield caddy; do
              state="$(systemctl is-active "$unit" || true)"
              echo "$unit: $state"
              [ "$state" = "active" ] || failures=$((failures + 1))
            done

            echo "== Telegram route =="
            ip route get 149.154.166.110 | head -1
            wg show redshield latest-handshakes || true
            code="$(curl -4 -s -o /dev/null -w '%{http_code}' --connect-timeout 10 https://api.telegram.org/ || echo 000)"
            echo "api.telegram.org (IPv4): $code"
            [ "$code" != "000" ] || failures=$((failures + 1))

            echo "== Bot identity =="
            set +e
            .venv/bin/python - <<'PY'
            import asyncio
            import os
            import subprocess
            from pathlib import Path

            def service_env(service):
                pid = subprocess.check_output(["systemctl", "show", service, "--property=MainPID", "--value"], text=True).strip()
                raw = Path("/proc", pid, "environ").read_bytes()
                return dict(item.decode().split("=", 1) for item in raw.split(b"\0") if b"=" in item)

            web_env = service_env("hr-bot-web")
            worker_env = service_env("hr-bot-worker")
            os.environ.update(web_env)
            from app.config import settings
            from app.messaging.telegram import create_telegram_messenger

            async def inspect():
                client = create_telegram_messenger(settings.TELEGRAM_BOT_TOKEN)
                try:
                    me = await client.bot.get_me()
                finally:
                    await client.close()
                configured = web_env.get("TELEGRAM_BOT_USERNAME", "").strip().lstrip("@")
                worker_configured = worker_env.get("TELEGRAM_BOT_USERNAME", "").strip().lstrip("@")
                username_ok = bool(configured) and configured.lower() == (me.username or "").lower()
                tokens_equal = bool(web_env.get("TELEGRAM_BOT_TOKEN")) and web_env.get("TELEGRAM_BOT_TOKEN") == worker_env.get("TELEGRAM_BOT_TOKEN")
                print("getMe username:", me.username)
                print("web configured username:", configured or "MISSING")
                print("worker configured username:", worker_configured or "MISSING")
                print("username matches:", username_ok)
                print("web/worker token env equal:", tokens_equal)
                if not (username_ok and tokens_equal and worker_configured.lower() == configured.lower()):
                    raise SystemExit(2)

            try:
                asyncio.run(inspect())
            except SystemExit:
                raise
            except Exception as exc:
                print("bot identity check failed:", type(exc).__name__)
                raise SystemExit(1)
            PY
            identity_rc=$?
            set -e
            [ "$identity_rc" = "0" ] || failures=$((failures + 1))

            echo "== HTTP =="
            for path in /app/employees /app/flows/workspace-v2 /app/grades; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 "https://hr.zephyrlab.ru${path}" || echo 000)"
              echo "HTTPS ${path}: ${code}"
              case "$code" in 200|303) ;; *) failures=$((failures + 1));; esac
            done

            echo "== Worker log (last ${WORKER_LOG_MINUTES} min) =="
            if journalctl -u hr-bot-worker --since "${WORKER_LOG_MINUTES} minutes ago" --no-pager -n 200 \
                | grep -E 'TelegramNetworkError|Request timeout|Traceback|Unclosed client session'; then
              failures=$((failures + 1))
            else
              echo "no Telegram/network errors"
            fi

            if [ "$TRACEBACK_FRAMES" = "true" ]; then
              echo "== Sanitized web/worker traceback frames =="
              python3 - <<'PY'
            import os
            import re
            import subprocess

            minutes = int(os.environ["WORKER_LOG_MINUTES"])
            if not 1 <= minutes <= 60:
                raise SystemExit("worker_log_minutes must be between 1 and 60")
            output = subprocess.check_output(
                ["journalctl", "-u", "hr-bot-worker", "-u", "hr-bot-web", "--since", f"{minutes} minutes ago", "--no-pager", "-o", "cat", "-n", "1000"],
                text=True,
            )
            in_traceback = False
            for line in output.splitlines():
                if line.startswith("Traceback (most recent call last):"):
                    in_traceback = True
                    print("Traceback:")
                    continue
                if not in_traceback:
                    continue
                frame = re.match(r'\s*File "([^"]+)", line (\d+), in ([\w<>]+)', line)
                if frame:
                    print(f"  {frame.group(1)}:{frame.group(2)} in {frame.group(3)}")
                    continue
                error = re.match(r'^([A-Za-z_][\w.]*(?:Error|Exception|Warning))(?::|$)', line)
                if error:
                    category = ""
                    if error.group(1).endswith("OperationalError"):
                        detail = line.lower()
                        category = next(
                            (label for needle, label in (
                                ("database is locked", "database_locked"),
                                ("no such column", "missing_column"),
                                ("no such table", "missing_table"),
                                ("readonly database", "readonly_database"),
                                ("disk i/o error", "disk_io_error"),
                            ) if needle in detail),
                            "other",
                        )
                    print(f"  {error.group(1)}" + (f" category={category}" if category else ""))
                    in_traceback = False
            PY
            fi

            echo "== Result: ${failures} failing check(s) =="
            [ "$failures" = "0" ]
